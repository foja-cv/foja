[project]
name = "curriculum"
version = "1.0.0"
description = "CV generators (Python and C) sharing the data in data/"
requires-python = ">=3.13"
dependencies = ["cvgen"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["python"]

[tool.uv.sources]
cvgen = { workspace = true }

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
