# Development only (rootless Podman): Astro dev server with hot reload behind nginx, at http://127.0.0.1:8090/
# The repository is mounted read-only, so nothing that runs in the container can change the sources or .git.
# Dependencies, caches and output live in volumes; their mount points have to exist in the checkout:
#   mkdir -p node_modules apps/web/node_modules apps/web/.astro apps/web/dist .out
name: foja
# No pod: scripts/e2e.sh joins the network of the nginx container, which Podman refuses for a container in a pod.
x-podman:
  in_pod: false
services:
  web:
    image: docker.io/library/node:24-alpine
    user: "1000:1000"
    working_dir: /app
    environment:
      npm_config_cache: /tmp/npm
    # Installs exactly what package-lock.json says, and only when it changed since the last install. The dev server
    # starts from apps/web: `npm run dev -w apps/web` from the read-only root is killed with SIGTERM at once.
    command:
      - sh
      - -c
      - >-
        h=$$(sha1sum package-lock.json | cut -d' ' -f1);
        if [ "$$(cat node_modules/.lock-sha1 2>/dev/null)" != "$$h" ]; then
        npm ci --no-fund --no-audit && echo "$$h" > node_modules/.lock-sha1; fi
        && cd apps/web && exec npm run dev
    volumes:
      - ./:/app:ro
      - node_modules:/app/node_modules:U
      - web_node_modules:/app/apps/web/node_modules:U
      - web_dist:/app/apps/web/dist:U
      - out:/app/.out:U
    # Astro's cache, new in every container: Astro 7 records its dev server's pid in .astro/dev.json and stops
    # that pid when it starts, which in a fresh container can be the new server itself.
    tmpfs:
      - /app/apps/web/.astro:mode=1777,notmpcopyup
  nginx:
    image: docker.io/library/nginx:1.30-alpine
    depends_on: [web]
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  node_modules:
  web_node_modules:
  web_dist:
  out:
