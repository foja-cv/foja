# Development only (rootless Podman): Astro dev server with hot reload behind nginx, at http://127.0.0.1:8090/
# The repository is mounted read-only, so nothing that runs in the container can change the sources or .git.
# Dependencies, caches and output live in volumes; their mount points have to exist in the checkout:
#   mkdir -p node_modules apps/web/node_modules apps/web/.astro apps/web/dist .out
name: foja
services:
  web:
    image: docker.io/library/node:24-alpine
    user: "1000:1000"
    working_dir: /app
    environment:
      npm_config_cache: /tmp/npm
    # Installs exactly what package-lock.json says, and only when it changed since the last install.
    command:
      - sh
      - -c
      - >-
        h=$$(sha1sum package-lock.json | cut -d' ' -f1);
        if [ "$$(cat node_modules/.lock-sha1 2>/dev/null)" != "$$h" ]; then
        npm ci --no-fund --no-audit && echo "$$h" > node_modules/.lock-sha1; fi && npm run dev
    volumes:
      - ./:/app:ro
      - node_modules:/app/node_modules:U
      - web_node_modules:/app/apps/web/node_modules:U
      - web_astro:/app/apps/web/.astro:U
      - web_dist:/app/apps/web/dist:U
      - out:/app/.out:U
  nginx:
    image: docker.io/library/nginx:1.30-alpine
    depends_on: [web]
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  node_modules:
  web_node_modules:
  web_astro:
  web_dist:
  out:
