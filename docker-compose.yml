# Development only: Astro dev server with hot reload behind nginx, at http://127.0.0.1:8090/
name: foja
services:
  web:
    image: node:24-alpine
    user: "1000:1000"
    working_dir: /app
    environment:
      npm_config_cache: /tmp/npm
    command: sh -c "npm install --no-fund --no-audit && npm run dev"
    volumes:
      - ./:/app

  nginx:
    image: nginx:alpine
    depends_on: [web]
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
