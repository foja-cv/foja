[project]
name = "cvgen"
version = "0.1.0"
description = "Builds the CV from data/ as LaTeX and compiles it with tectonic"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
cvgen = "cvgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvgen"]
