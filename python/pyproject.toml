[project]
name = "cvgen"
version = "1.0.0"
description = "Builds the CV from data/ as LaTeX and compiles it with tectonic"
requires-python = ">=3.13"
dependencies = [
    "pillow>=13.0.0",
    "python-docx>=1.2.0",
    "typst>=0.15.0",
]

[project.scripts]
cvgen = "cvgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvgen"]
